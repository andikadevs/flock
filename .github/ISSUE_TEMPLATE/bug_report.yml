name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Remove secrets such as bot tokens, `TOKEN_ENCRYPTION_KEY`, or `OIDC_CLIENT_SECRET` from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server with `bun run dev`
        2. Add a bot with the echo handler
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected area
      options:
        - Dashboard
        - Bot runner / handlers
        - Sign-in (OIDC)
        - Webhook delivery
        - Docker / deployment
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant server output, and the bot's event log from the dashboard.
      render: text
