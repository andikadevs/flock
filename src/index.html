<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flock</title>
    <meta name="description" content="Run a flock of Telegram bots from one dashboard." />
    <link rel="icon" type="image/svg+xml" href="./frontend/assets/flock-logo.svg" />
    <script>
      // Mirrors features/theme/theme.ts: stored choice first, then the OS preference.
      (() => {
        let stored = null;
        try { stored = localStorage.getItem("theme"); } catch {}
        const dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend/main.tsx"></script>
  </body>
</html>
