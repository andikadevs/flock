<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Flock">
  <defs>
    <!-- userSpaceOnUse, so the cut-outs below match the disc behind them exactly. -->
    <linearGradient id="flock-sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="48">
      <stop offset="0" stop-color="#37BBFE"/>
      <stop offset="1" stop-color="#1D93D2"/>
    </linearGradient>
  </defs>
  <circle cx="24" cy="24" r="24" fill="url(#flock-sky)"/>
  <!-- Three gulls overlapping like roof tiles: each is drawn after the one below it,
       with a sky-coloured outline, so its left wing tucks over that bird's right wing. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.03 28.62C10.67 26.55 13.66 27.93 15.5 31.38C17.34 27.93 20.33 26.55 22.98 28.62" stroke="url(#flock-sky)" stroke-width="5.4"/>
