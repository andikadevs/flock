    <path d="M16.52 22.62C19.17 20.55 22.16 21.93 24 25.38C25.84 21.93 28.83 20.55 31.48 22.62" stroke="url(#flock-sky)" stroke-width="5.4"/>
    <path d="M16.52 22.62C19.17 20.55 22.16 21.93 24 25.38C25.84 21.93 28.83 20.55 31.48 22.62" stroke="#fff" stroke-width="2.8"/>
    <path d="M25.02 16.62C27.67 14.55 30.66 15.93 32.5 19.38C34.34 15.93 37.33 14.55 39.98 16.62" stroke="url(#flock-sky)" stroke-width="5.4"/>
    <path d="M25.02 16.62C27.67 14.55 30.66 15.93 32.5 19.38C34.34 15.93 37.33 14.55 39.98 16.62" stroke="#fff" stroke-width="2.8"/>
  </g>
</svg>
